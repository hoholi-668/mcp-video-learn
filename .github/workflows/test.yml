name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 固定 ubuntu-22.04：ubuntu-latest 已切到 26.04，apt 源偶发 DNS 失败（实测 2026-11-11 连续 5 次）
        os: [ubuntu-22.04, windows-latest]
        node: [20, 22]
        exclude:
          # Windows 只跑 Node 22：Windows runner 启动慢，跑一份够证明跨平台
          - os: windows-latest
            node: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 装 ffmpeg（Linux）
        if: runner.os == 'Linux'
        run: |
          # apt 源偶发 DNS 失败（security.ubuntu.com / archive.ubuntu.com），重试 3 次
          ok=0
          for i in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 \
              && sudo apt-get install -y ffmpeg -o Acquire::Retries=3; then
              ok=1
              break
            fi
            echo "apt 失败（第 $i 次），5 秒后重试"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "apt 三次都失败；改用静态 ffmpeg 兜底"
            curl -fsSL -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
            sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/ffmpeg
            sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/ffprobe
            sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
          fi
          ffmpeg -version | head -1

      - name: 装 ffmpeg（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          # choco 的 shim 目录写进后续步骤的 PATH
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:Path = "C:\ProgramData\chocolatey\bin;$env:Path"
          ffmpeg -version | Select-Object -First 1

      - name: 装依赖
        run: npm install --no-audit --no-fund

      - name: 环境信息
        shell: pwsh
        run: |
          node -v
          ffmpeg -version | Select-Object -First 1
          Write-Output "platform=$($env:RUNNER_OS)"

      - name: 单元测试
        run: npm test

      # 全用 ffmpeg 合成的测试素材，不联网、不需要真实视频
      - name: 真实媒体矩阵
        shell: pwsh
        run: |
          $tmp = if ($env:RUNNER_OS -eq 'Windows') { Join-Path $env:RUNNER_TEMP 'matrix' } else { '/tmp/matrix' }
          node scripts/selftest-matrix.mjs "$tmp"

      # 说明：MCP 协议层测试里有一步会访问 api.bilibili.com，
      # CI 环境（海外机房 IP）大概率被 412，所以这里不跑，留给本地/服务器。

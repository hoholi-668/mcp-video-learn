name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 装 ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: 装依赖
        run: npm install --no-audit --no-fund

      - name: 环境信息
        run: |
          node -v
          ffmpeg -version | head -1

      - name: 单元测试
        run: npm test

      # 全用 ffmpeg 合成的测试素材，不联网、不需要真实视频
      - name: 真实媒体矩阵
        run: node scripts/selftest-matrix.mjs /tmp/matrix

      # 说明：MCP 协议层测试里有一步会访问 api.bilibili.com，
      # CI 环境（海外机房 IP）大概率被 412，所以这里不跑，留给本地/服务器。
